name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Testes
        run: dotnet test -c Release

      - name: Gerar executável
        run: dotnet publish src/PcTuner -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o publish

      - name: Compactar
        run: Compress-Archive -Path publish/PcTuner.exe -DestinationPath PcTuner-win-x64.zip
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: PcTuner-win-x64
          path: PcTuner-win-x64.zip

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release create "${{ github.ref_name }}" PcTuner-win-x64.zip --title "PC Tuner ${{ github.ref_name }}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
